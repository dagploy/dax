[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "dagploy_dax",
    "dagploy_dax.*",
]

[project]
name = "dagploy-dax"
version = "1.1.6"
description = "AIOps Infra provisioning in your cloud"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Dagploy", email = "info@dagploy.com" }
]
dependencies = [
    "setuptools",
    "grpcio",
    "grpcio-status",
    "tenacity",
    "orjson",
    "rich",
    "google-cloud-compute",
    "pulumi-command==1.1.3",
    "pulumi-gcp",
    "pulumi",
    "hydra-core",
    "petname",
    "toml",
    "google-cloud-storage",
    "typer",
    "google-api-python-client",
    "uvloop",
    "hatchet-sdk",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "google-cloud-secret-manager"
]
keywords = ["dax", "dagploy", "infra", "pipelines", "cloud infra", "iac", "cloud", "ai", "aiops", "provisioning"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]


[project.urls]
homepage = "https://www.dagploy.com"
issues = "https://github.com/dagploy/dax/issues"
documentation = "https://docs.dagploy.com/"
repository = "https://github.com/dagploy/dax"
