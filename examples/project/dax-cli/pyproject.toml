[project]
name = "dax-cli"
version = "0.1.0"
description = "DAX CLI for AI infra agents"
requires-python = ">=3.10"
dependencies = [
  "click",
  "rich",
  "httpx",
  "petname",
]

[project.scripts]
dax = "dax.cli:cli"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dax"]